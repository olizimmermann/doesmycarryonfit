services:
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    # Harden the container
    read_only: true
    tmpfs:
      - /var/cache/nginx:mode=755
      - /var/run:mode=755
      - /tmp:mode=755
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE   # bind port 80
      - CHOWN              # entrypoint sets up cache dir ownership
      - SETUID             # master process drops to nginx user for workers
      - SETGID             # master process drops to nginx group for workers
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
