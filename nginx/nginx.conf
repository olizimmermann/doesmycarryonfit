worker_processes auto;
pid        /tmp/nginx.pid;
error_log  /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Hide nginx version in headers and error pages
    server_tokens off;

    # ---------------------------------------------------------------------------
    # Cloudflare real IP restoration
    # Replaces $remote_addr (Cloudflare edge IP) with the actual visitor IP.
    # $realip_remote_addr retains the original Cloudflare edge IP for the geo check.
    # Keep in sync with: https://www.cloudflare.com/ips/
    # ---------------------------------------------------------------------------
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header    CF-Connecting-IP;

    # $remote_addr is now the real visitor IP
    log_format main '[$time_local] $remote_addr "$request" '
                    '$status ${body_bytes_sent}b ${request_time}s '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;

    keepalive_timeout 65;

    # Gzip
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Rate-limit the /log beacon endpoint (5 req/s per IP, short burst of 10)
    limit_req_zone $binary_remote_addr zone=logbeacon:1m rate=5r/s;
    limit_req_status 429;

    # ---------------------------------------------------------------------------
    # Cloudflare-only access
    # Allow connections only from Cloudflare edge IPs.
    # Keep this list up-to-date: https://www.cloudflare.com/ips/
    # ---------------------------------------------------------------------------
    geo $realip_remote_addr $not_cloudflare {
        default         1;

        # Allow loopback for Docker healthcheck
        127.0.0.1        0;

        # Cloudflare IPv4
        173.245.48.0/20  0;
        103.21.244.0/22  0;
        103.22.200.0/22  0;
        103.31.4.0/22    0;
        141.101.64.0/18  0;
        108.162.192.0/18 0;
        190.93.240.0/20  0;
        188.114.96.0/20  0;
        197.234.240.0/22 0;
        198.41.128.0/17  0;
        162.158.0.0/15   0;
        104.16.0.0/13    0;
        104.24.0.0/14    0;
        172.64.0.0/13    0;
        131.0.72.0/22    0;

        # Cloudflare IPv6
        2400:cb00::/32   0;
        2606:4700::/32   0;
        2803:f800::/32   0;
        2405:b500::/32   0;
        2405:8100::/32   0;
        2a06:98c0::/29   0;
        2c0f:f248::/32   0;
    }

    server {
        listen 80;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # Block any request not originating from Cloudflare
        if ($not_cloudflare) {
            return 444;  # Drop connection silently
        }

        # Security headers
        add_header X-Content-Type-Options   "nosniff"                           always;
        add_header X-Frame-Options          "DENY"                              always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin"   always;
        add_header Permissions-Policy       "geolocation=(), camera=(), microphone=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy
            "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';"
            always;

        # Cache: no-cache for HTML (always fresh), long cache for versioned assets
        location ~* \.html$ {
            add_header Cache-Control "no-cache, must-revalidate" always;
            # Re-add security headers (they don't inherit inside location blocks)
            add_header X-Content-Type-Options   "nosniff"                         always;
            add_header X-Frame-Options          "DENY"                            always;
            add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            add_header Content-Security-Policy
                "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self';"
                always;
        }

        location = /version.js {
            add_header Cache-Control "no-store" always;
        }

        location ~* \.(css|js)$ {
            add_header Cache-Control "public, max-age=3600, stale-while-revalidate=600" always;
        }

        # Usage-tracking beacon — returns empty 204, Wazuh reads the access log
        location = /status {
            limit_req zone=logbeacon burst=10 nodelay;
            access_log /var/log/nginx/access.log main;
            return 204;
        }

        location / {
            try_files $uri $uri/ =404;
        }

        # Block dotfiles
        location ~ /\. {
            deny all;
        }

    }
}
