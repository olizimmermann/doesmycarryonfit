name: "✈️ New Airline Request"
description: "Request to add an airline that is not yet listed."
labels: ["new airline"]
body:
  - type: markdown
    attributes:
      value: |
        Please provide the official cabin size policy for the airline you'd like added.

  - type: input
    id: airline
    attributes:
      label: Airline name
      placeholder: "e.g. Batik Air"
    validations:
      required: true

  - type: input
    id: iata
    attributes:
      label: IATA code
      placeholder: "e.g. ID"
    validations:
      required: false

  - type: input
    id: dims_cm
    attributes:
      label: Cabin dimensions — cm (H × W × D)
      placeholder: "e.g. 56 × 36 × 23"
    validations:
      required: true

  - type: input
    id: dims_in
    attributes:
      label: Cabin dimensions — in (H × W × D), if available
      placeholder: "e.g. 22.0 × 14.1 × 9.0"
    validations:
      required: false

  - type: input
    id: sum
    attributes:
      label: Total linear dimension limit, if stated instead of H×W×D
      placeholder: "e.g. 115 cm / 45 in"
    validations:
      required: false

  - type: input
    id: eco_weight
    attributes:
      label: Economy weight limit
      placeholder: "e.g. 7 kg / 15.4 lbs — enter N/A if not specified"
    validations:
      required: true

  - type: input
    id: biz_weight
    attributes:
      label: Business weight limit
      placeholder: "e.g. 10 kg / 22 lbs — enter N/A if not specified"
    validations:
      required: false

  - type: input
    id: source
    attributes:
      label: Source (official airline page)
      placeholder: "https://www.airline.com/en/baggage/carry-on"
    validations:
      required: true
